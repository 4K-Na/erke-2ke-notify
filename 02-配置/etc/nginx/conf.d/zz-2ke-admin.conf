# 若依 2ke 通知管理后台
server {
    listen 18089 default_server;
    server_name <SERVER_IP>;

    root /opt/ruoyi-ui/dist;
    index index.html;
    client_max_body_size 30m;

    # 前端静态 + history 路由回退
    # 后端重启/启动期间给个提示页，而不是干巴巴的 502
    error_page 502 503 504 /starting.html;
    location = /starting.html {
        internal;
        root /var/www/error;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 后端 API

    # 登录口限速（防爆破）
    location = /prod-api/login {
        limit_req zone=loginzone burst=3 nodelay;
        proxy_pass http://127.0.0.1:18081/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /prod-api/ {
        proxy_pass http://127.0.0.1:18081/;
        # 后端启动/重启期间返回可读 JSON，而不是让前端拿到裸 502
        error_page 502 503 504 = @api_starting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    # 后端不可用时给前端一个明确的响应
    location @api_starting {
        default_type application/json;
        return 503 '{"code":503,"msg":"系统正在启动，约需 1-2 分钟，请稍候刷新","data":null}';
    }
}