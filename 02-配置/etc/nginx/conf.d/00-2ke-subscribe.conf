# 第二课堂订阅站（原 openclaw 临时文件改名）
server {
    listen 80 default_server;
    server_name <SERVER_IP> _;

    # ── 主页：第二课堂订阅页 ──
    location / {
        root /var/www/2ke-subscribe;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── 兼容旧链接 ──
    location /subscribe/ {
        alias /var/www/2ke-subscribe/;
        index index.html;
        try_files $uri $uri/ /subscribe/index.html;
    }


    # 公告页 / 订阅页用到的若依接口（缺这段时 IP 入口的公告页会报"加载失败"）
    location ^~ /2ke-api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /2ke-api/login {
        limit_req zone=loginzone burst=3 nodelay;
        proxy_pass http://127.0.0.1:18081/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # ── 企业微信回调 ──
    location /wecom/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 公告页（微信插件菜单入口）
    location = /notice {
        root /var/www/2ke-subscribe;
        try_files /notice.html =404;
        default_type text/html;
    }

    # 后端 API（公告页等前端页面调用）
    location /prod-api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 船舶电气工程导论答题站 ──
    location ^~ /quiz/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /quiz {
        return 301 /quiz/;
    }
}
