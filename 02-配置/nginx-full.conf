# configuration file /etc/nginx/conf.d/00-2ke-subscribe.conf:
# 第二课堂订阅站（原 openclaw 临时文件改名）
server {
    listen 80 default_server;
    server_name <SERVER_IP> _;

    # ── 主页：第二课堂订阅页 ──
    location / {
        root /var/www/2ke-subscribe;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── 兼容旧链接 ──
    location /subscribe/ {
        alias /var/www/2ke-subscribe/;
        index index.html;
        try_files $uri $uri/ /subscribe/index.html;
    }


    # 公告页 / 订阅页用到的若依接口（缺这段时 IP 入口的公告页会报"加载失败"）
    location ^~ /2ke-api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /2ke-api/login {
        limit_req zone=loginzone burst=3 nodelay;
        proxy_pass http://127.0.0.1:18081/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # ── 企业微信回调 ──
    location /wecom/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 公告页（微信插件菜单入口）
    location = /notice {
        root /var/www/2ke-subscribe;
        try_files /notice.html =404;
        default_type text/html;
    }

    # 后端 API（公告页等前端页面调用）
    location /prod-api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 船舶电气工程导论答题站 ──
    location ^~ /quiz/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /quiz {
        return 301 /quiz/;
    }
}

# configuration file /etc/nginx/conf.d/00-ratelimit.conf:
# 登录接口限速（防口令爆破）；只在 /login 精确路径生效
limit_req_zone $binary_remote_addr zone=loginzone:10m rate=10r/m;
limit_req_status 429;

# configuration file /etc/nginx/conf.d/zz-2ke-admin-ssl.conf:
# 若依 2ke 通知后台 —— HTTPS 入口
# 用 example.com 的现有证书（到期 2026-12-08），不依赖新增 DNS
# 与 18089(HTTP) 指向同一份 dist 与同一个后端 18081
server {
    listen 18443 ssl http2;
    server_name example.com <SERVER_IP>;

    root /opt/ruoyi-ui/dist;
    index index.html;
    client_max_body_size 30m;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL2ke:5m;
    ssl_session_timeout 10m;

    # 登录口限速（与 HTTP 入口共用 loginzone）
    location = /prod-api/login {
        limit_req zone=loginzone burst=3 nodelay;
        proxy_pass http://127.0.0.1:18081/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /prod-api/ {
        proxy_pass http://127.0.0.1:18081/;
        # 后端启动/重启期间返回可读 JSON，而不是让前端拿到裸 502
        error_page 502 503 504 = @api_starting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 后端重启/启动期间给个提示页，而不是干巴巴的 502
    error_page 502 503 504 /starting.html;
    location = /starting.html {
        internal;
        root /var/www/error;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # 后端不可用时给前端一个明确的响应
    location @api_starting {
        default_type application/json;
        return 503 '{"code":503,"msg":"系统正在启动，约需 1-2 分钟，请稍候刷新","data":null}';
    }
}
# configuration file /etc/nginx/conf.d/zz-2ke-admin.conf:
# 若依 2ke 通知管理后台
