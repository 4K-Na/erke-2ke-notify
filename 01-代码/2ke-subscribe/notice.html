<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>公告 · 第二课堂通知</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#f5f6f8;color:#1a1a1a;line-height:1.7;
    padding:18px 14px 40px;max-width:560px;margin:0 auto;
  }
  .head{text-align:center;padding:8px 0 20px}
  .head h1{font-size:19px;font-weight:600;letter-spacing:.3px}
  .head p{font-size:12px;color:#9aa0a8;margin-top:5px}

  .card{
    background:#fff;border-radius:12px;padding:16px 16px 15px;
    margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);
    position:relative;
  }
  .card.pinned{border-left:3px solid #1a6dff}
  .pin{
    display:inline-block;font-size:10.5px;color:#1a6dff;
    background:#eef4ff;border-radius:4px;padding:1px 6px;
    margin-bottom:7px;letter-spacing:.5px;
  }
  .title{font-size:15.5px;font-weight:600;margin-bottom:9px;color:#15171c}
  .content{
    font-size:13.5px;color:#3b3f47;white-space:pre-wrap;word-break:break-word;
  }
  .meta{
    font-size:11.5px;color:#b0b5bd;margin-top:10px;
    padding-top:9px;border-top:1px solid #f2f3f5;
  }
  .empty{
    background:#fff;border-radius:12px;padding:44px 20px;text-align:center;
    color:#c0c4cc;font-size:13.5px;
  }
  .foot{text-align:center;font-size:11.5px;color:#b0b5bd;margin-top:24px;line-height:1.9}
  .foot a{color:#1a6dff;text-decoration:none}
  .loading{text-align:center;padding:40px;color:#c0c4cc;font-size:13px}
</style>
</head>
<body>

<div class="head">
  <h1>公告</h1>
  <p>第二课堂活动通知</p>
</div>

<div id="list"><div class="loading">加载中…</div></div>

<div class="foot">
  个人搭建，非官方<br>
  <a href="/">返回订阅页</a>
</div>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtDate(v) {
  if (!v) return '';
  var m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[1] + '-' + m[2] + '-' + m[3]) : '';
}
function render(rows) {
  var box = document.getElementById('list');
  if (!rows || !rows.length) {
    box.innerHTML = '<div class="empty">暂无公告</div>';
    return;
  }
  var html = '';
  rows.forEach(function (n) {
    var pinned = n.pinned === '1';
    html += '<div class="card' + (pinned ? ' pinned' : '') + '">';
    if (pinned) html += '<span class="pin">置顶</span>';
    html += '<div class="title">' + esc(n.title) + '</div>';
    html += '<div class="content">' + esc(n.content) + '</div>';
    var d = fmtDate(n.createTime);
    if (d) html += '<div class="meta">' + d + '</div>';
    html += '</div>';
  });
  box.innerHTML = html;
}
fetch('/2ke-api/system/tnotice/public/list', { headers: { 'Content-Type': 'application/json' } })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    var d = j && j.data ? j.data : (Array.isArray(j) ? j : []);
    render(d);
  })
  .catch(function () {
    document.getElementById('list').innerHTML =
      '<div class="empty">公告加载失败，请稍后重试</div>';
  });
</script>
</body>
</html>
